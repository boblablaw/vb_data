[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vb-data"
version = "0.1.0"
description = "NCAA D1 women's volleyball data pipeline: scrape -> Postgres -> FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",  # pandas.read_html bs4 fallback for NCAA's messy linescore HTML (lxml chokes)
    "lxml>=5.0",
    "playwright>=1.45",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "requests>=2.31",
    # Accounts / passkeys / email / AI (see plan: Accounts, Passkeys, Favorites, Admin & MCP)
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "webauthn>=2.0",
    "anthropic>=0.40",
    "mcp>=1.2",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
vb = "vb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the static fantasy UI (non-.py files) inside the wheel so the container image serves it.
# Recursive globs so nested assets (e.g. static/assets/logos/ncaa/*.svg) are packaged too.
[tool.setuptools.package-data]
"vb.api" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001: blind `except Exception` is deliberate in DB probes / best-effort parsers.
# B008:   typer.Option()/Argument() in defaults is the canonical Typer pattern.
# S110:   try/except/pass guards resumable scrape/load reads intentionally.
# DTZ007: NCAA renders naive local wall-clock times we store as strings; no tz semantics.
ignore = ["BLE001", "B008", "S110", "DTZ007"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
