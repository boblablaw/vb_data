# Overlay that adds the public fantasy web UI (FastAPI in a container) on the OCI box
# (mediaserver), reachable on the PUBLIC internet at https://<WIKI-style duckdns host>.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build vb-api
#
# (scripts/deploy.sh runs exactly this — guarded so it's a no-op off the box.)
#
# Like the Docmost overlay on this same box, this does NOT run its own Caddy. The box already
# runs "edge-caddy" (stock caddy:2-alpine on the external `deploy_web` network) which owns
# 80/443. vb-api joins `deploy_web` so edge-caddy can reverse_proxy it by name (vb-api:8091).
# The site block is appended to edge-caddy's Caddyfile as a one-time step (see
# deploy/OCI_SETUP.md §10) — it is NOT managed by this compose file.
#
# vb-api reaches Postgres over the compose default network at db:5432, as the read-only role
# vb_ro (see OCI_SETUP.md §10 for the CREATE ROLE + statement_timeout). No public host port is
# published for the API — public traffic arrives only via edge-caddy over deploy_web.
services:
  vb-api:
    build: .
    image: vb-data-api:latest
    container_name: vb-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets + runtime config (JWT_SECRET, ADMIN_*, MAIL_*, BASE_URL, WEBAUTHN_*, SENTRY_* for
    # error tracking, and the VB_API_DATABASE_URL that selects the DB role) live in a .env on the
    # box, out of git. It is
    # optional: `required: false` keeps `docker compose` working off-box where no .env exists.
    env_file:
      - path: .env
        required: false
    environment:
      # DB role selection. The public app needs WRITE access to the five account tables (users,
      # favorites, passkeys, email_verifications, app_settings) but must NOT be able to corrupt
      # scraped stats — so the box .env sets VB_API_DATABASE_URL to the least-privilege `vb_app`
      # role (SELECT everywhere + write only on those tables; see OCI_SETUP.md §10a). The default
      # below is the read-only `vb_ro` role, kept as a safe fallback for a fresh/off-box bring-up
      # (accounts/favorites will 500 until vb_app is configured — read endpoints still serve).
      DATABASE_URL: "${VB_API_DATABASE_URL:-postgresql+psycopg://vb_ro:vb_ro@db:5432/vb}"
      # Player headshots aren't baked into the image (unlike team logos) — the host scraper writes
      # them to <repo>/data/player_photos and we bind-mount that dir in below. Point the app's
      # photos_dir at the mount so /ui/assets/player_photos/* serves the freshly-scraped files.
      VB_PHOTOS_DIR: "/data/player_photos"
    volumes:
      # Host dir the weekly `vb scrape-photos` job fills (read-only in the container). The source is
      # relative to the compose file (the repo root on the box), matching the host scraper's default
      # settings.photos_dir (<repo>/data/player_photos), so both sides point at the same files.
      - ./data/player_photos:/data/player_photos:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - default        # reach db:5432 and ncaa-api:3000
      - deploy_web     # reachable by the shared edge-caddy at vb-api:8091

  # Self-hosted wrapper around ncaa.com (henrygd/ncaa-api). ncaa.com is a DIFFERENT host from the
  # Akamai-blocked stats.ncaa.org, so this is our resilient primary for schedules / box scores /
  # lineups even when stats.ncaa.org blocks the box. Two consumers reach it:
  #   - the vb-api container, over the compose `default` network, at http://ncaa-api:3000
  #   - host-venv scrapers (systemd timers run from the host, not a container), over loopback at
  #     http://127.0.0.1:3013 — hence the 127.0.0.1-only host publish (never exposed publicly).
  # Port 3013 is registered in ~/projects/CLAUDE.md. The upstream image listens on :3000.
  ncaa-api:
    image: henrygd/ncaa-api
    container_name: ncaa-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:3000"
    # No container healthcheck: henrygd/ncaa-api is a distroless image (cmd `./server`, no shell, no
    # wget/curl, no node/bun), so a CMD-SHELL probe can never run inside it — it reported "unhealthy"
    # forever regardless of URL. Nothing gates on this container's health anyway (vb-api's only
    # depends_on is db: service_healthy), and `restart: unless-stopped` still recovers a crashed
    # process. Liveness is instead observed end-to-end: vb-api and the host scrapers call it and log
    # failures. Explicitly disable so `docker compose ps` shows an honest "Up" instead of a false
    # "unhealthy".
    healthcheck:
      disable: true
    networks:
      - default        # reachable by vb-api as ncaa-api:3000

networks:
  deploy_web:
    external: true     # created by the travel-rewards stack (docker network `deploy_web`)
  default: {}
