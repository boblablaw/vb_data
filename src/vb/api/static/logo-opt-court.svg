<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Court mark: a volleyball court seen from above — boundary, net down the middle, attack
       lines, ball at center. Sport identity without another ball-in-a-circle. -->
  <rect width="32" height="32" rx="7" fill="#e8622c"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <rect x="6.5" y="8.5" width="19" height="15" rx="1.5" stroke-width="1.7"/>
    <line x1="16" y1="8.5" x2="16" y2="23.5" stroke-width="1.7"/>
    <line x1="11" y1="8.5" x2="11" y2="23.5" stroke-width="1" opacity="0.55"/>
    <line x1="21" y1="8.5" x2="21" y2="23.5" stroke-width="1" opacity="0.55"/>
  </g>
  <circle cx="16" cy="16" r="2.2" fill="#fff"/>
</svg>
