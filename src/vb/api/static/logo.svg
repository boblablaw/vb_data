<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 56" role="img" aria-label="VBallr">
  <!-- Ball badge (self-contained, same mark as favicon.svg) -->
  <g transform="translate(4 4)">
    <rect width="48" height="48" rx="11" fill="#e8622c"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="translate(8 8) scale(1)">
      <circle cx="16" cy="16" r="9.5"/>
      <path id="seam" d="M16 6.5 C 14.4 12 19.6 16.4 24.2 20.1"/>
      <use href="#seam" transform="rotate(120 16 16)"/>
      <use href="#seam" transform="rotate(240 16 16)"/>
    </g>
  </g>
  <!-- Wordmark: inherits surrounding text color; the "V" picks up the accent. -->
  <text x="66" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.5" fill="currentColor">
    <tspan fill="#e8622c">V</tspan><tspan>Ballr</tspan>
  </text>
</svg>
