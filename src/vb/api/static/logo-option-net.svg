<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Net: badge with the volleyball rising above a net — the most literal, sporty option. -->
  <rect width="32" height="32" rx="7" fill="#e8622c"/>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"
     transform="translate(16 12) scale(0.82) translate(-16 -16)">
    <circle cx="16" cy="16" r="9.5"/>
    <path id="ns" d="M16 6.5 C 14.4 12 19.6 16.4 24.2 20.1"/>
    <use href="#ns" transform="rotate(120 16 16)"/>
    <use href="#ns" transform="rotate(240 16 16)"/>
  </g>
  <!-- net: top tape + a light mesh -->
  <g stroke="#fff" stroke-linecap="round">
    <line x1="5" y1="23.5" x2="27" y2="23.5" stroke-width="1.5"/>
    <g stroke-width="0.7" opacity="0.85">
      <line x1="8" y1="23.5" x2="8" y2="27.5"/>
      <line x1="12" y1="23.5" x2="12" y2="27.5"/>
      <line x1="16" y1="23.5" x2="16" y2="27.5"/>
      <line x1="20" y1="23.5" x2="20" y2="27.5"/>
      <line x1="24" y1="23.5" x2="24" y2="27.5"/>
    </g>
  </g>
</svg>
