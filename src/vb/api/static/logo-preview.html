<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VBallr — logo options</title>
  <style>
    :root { --accent: #e8622c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #0d0f12; color: #e7e9ee; padding: 24px 16px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #9aa3af; font-size: 13px; margin: 0 0 24px; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card { border: 1px solid #262b33; border-radius: 12px; overflow: hidden; background: #14161a; }
    .card h2 { font-size: 15px; margin: 0; padding: 12px 14px 10px; }
    .card .note { font-size: 12px; color: #9aa3af; padding: 0 14px 12px; margin: 0; }
    .row { display: flex; align-items: center; gap: 16px; padding: 14px; }
    .row.dark { background: #14161a; }
    .row.light { background: #f6f7f9; }
    .row .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; width: 42px; flex: none; }
    .row.dark .lbl { color: #6b7280; }
    .row.light .lbl { color: #8b929c; }
    .sizes { display: flex; align-items: center; gap: 14px; }
    .sizes img { display: block; object-fit: contain; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: -.3px; }
    .row.dark .brand { color: #fff; }
    .row.light .brand { color: #14161a; }
    .brand .v { color: var(--accent); }
    .brand img { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <h1>VBallr — logo & favicon options</h1>
  <p class="sub">Each option shown at favicon sizes (16 / 32 / 64px) and as the header mark, on dark and light. Tell me which number you want and I'll wire it in as the favicon + header icon.</p>
  <div class="grid" id="grid"></div>
  <script>
    const OPTIONS = [
      ["1 — Classic (current)", "favicon.svg", "Orange badge, white 3-seam volleyball. What's live now — here for reference."],
      ["2 — “V” monogram", "logo-opt-mono.svg", "A bold V for VBallr. No ball at all — a letter-mark brand, like a real logo. Pairs naturally with the “VBallr” wordmark."],
      ["3 — Spike / motion", "logo-opt-spike.svg", "A ball with a dotted spike trajectory arcing into it. Conveys action, not a static ball sitting in a circle."],
      ["4 — Stat bars", "logo-opt-bars.svg", "Ascending data bars with a ball as the peak. Says “volleyball stats” — the actual thing the app does."],
      ["5 — Court", "logo-opt-court.svg", "The court from above: net, attack lines, ball at center. Sport identity without another ball-in-a-circle."],
    ];
    const grid = document.getElementById("grid");
    for (const [title, src, note] of OPTIONS) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h2>${title}</h2>
        <p class="note">${note}</p>
        <div class="row dark">
          <span class="lbl">Dark</span>
          <div class="sizes">
            <img src="${src}" width="16" height="16">
            <img src="${src}" width="32" height="32">
            <img src="${src}" width="64" height="64">
          </div>
        </div>
        <div class="row dark">
          <span class="lbl">Header</span>
          <div class="brand"><img src="${src}"><span class="v">V</span><span>Ballr</span></div>
        </div>
        <div class="row light">
          <span class="lbl">Light</span>
          <div class="sizes">
            <img src="${src}" width="16" height="16">
            <img src="${src}" width="32" height="32">
            <img src="${src}" width="64" height="64">
          </div>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
