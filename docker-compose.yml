services:
  db:
    image: postgres:16
    container_name: vb_data_postgres
    # Match vb-api/ncaa-api (docker-compose.remote.yml) so the database also comes back on host
    # reboot. Without this it defaulted to restart policy "no", so after a reboot the app containers
    # returned but db stayed down and vb-api sat unhealthy until db was started by hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: vb
      POSTGRES_PASSWORD: vb
      POSTGRES_DB: vb
    ports:
      - "5435:5432"   # host 5435 -> container 5432 (5432/5433/5434 already in use)
    volumes:
      - vb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb -d vb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vb_pgdata:
