services:
  db:
    image: postgres:16
    container_name: vb_data_postgres
    environment:
      POSTGRES_USER: vb
      POSTGRES_PASSWORD: vb
      POSTGRES_DB: vb
    ports:
      - "5435:5432"   # host 5435 -> container 5432 (5432/5433/5434 already in use)
    volumes:
      - vb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb -d vb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vb_pgdata:
